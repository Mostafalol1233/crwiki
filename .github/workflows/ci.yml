name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify browser bundle has no service-role configuration
        shell: bash
        run: |
          if grep -RInE 'VITE_(SUPABASE_)?SERVICE_KEY|SERVICE_ROLE_KEY' client/src; then
            echo 'A service-role credential reference was found in browser code.'
            exit 1
          fi

      - name: Typecheck
        run: pnpm run check

      - name: Build production client
        run: pnpm run build
