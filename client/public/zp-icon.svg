<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="zpGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="zpShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="zpGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hexagon body -->
  <polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5" fill="url(#zpGrad)" filter="url(#zpGlow)"/>
  <polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5" fill="url(#zpShine)"/>
  <!-- Border -->
  <polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5" fill="none" stroke="rgba(167,139,250,0.8)" stroke-width="1.5"/>
  <!-- ZP Text -->
  <text x="24" y="30" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#fff" letter-spacing="-0.5">ZP</text>
</svg>
